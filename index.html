<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nosso Diário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Caveat:wght@400;500;600;700&family=EB+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="glow"></div>

<div class="wrap">
  <div class="book-shell">
    <div class="book-frame">
      <div class="pages-edge" aria-hidden="true"></div>
      <div class="book" id="book"></div>
    </div>

    <div class="controls">
      <button class="nav-btn" id="prevPage" aria-label="Página anterior">‹</button>
      <span class="page-counter" id="pageCounter"></span>
      <button class="nav-btn" id="nextPage" aria-label="Próxima página">›</button>
    </div>

    <footer class="tiny">feito à mão, com tinta, cera e um coração inteiro</footer>
  </div>
</div>

<div class="hearts" id="hearts"></div>

<script src="entries.js"></script>
<script src="script.js"></script>
</body>
</html>
